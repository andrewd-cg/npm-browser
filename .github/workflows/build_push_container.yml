name: Build and push container

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Normal image: bun:latest base, tags sha-<sha> + latest.
          - bun_tag: latest
            flavor: ""
          # -dev image: bun:latest-dev base, same tags with -dev appended
          # (sha-<sha>-dev + latest-dev).
          - bun_tag: latest-dev
            flavor: "suffix=-dev,onlatest=true"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Chainguard
        uses: ./.github/actions/chainguard-auth

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: ${{ matrix.flavor }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUN_TAG=${{ matrix.bun_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
